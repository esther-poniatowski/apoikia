# Copier configuration shared by every template of apoikia.
#
# Copier reads this file at the repository root, so that `copier update` can locate it in any
# rendered instance. The `template` answer selects the subdirectory that renders the instance.

_min_copier_version: "9.4.0"
_subdirectory: "templates/{{ template }}"

# Files owned by the organization once created: rendered on the first copy only, never
# overwritten by `copier update`.
_skip_if_exists:
  - profile/README.md

template:
  type: str
  help: Instance to render
  choices:
    Public `.github` repository of the organization: org-github

org_login:
  type: str
  help: GitHub login of the organization (as in https://github.com/<login>)

org_name:
  type: str
  help: Display name of the organization

website:
  type: str
  default: ""
  help: Public website of the team (empty if none)

contact_url:
  type: str
  default: "{{ website }}"
  help: Page that external people use to contact the team (empty if none)

apoikia_repo:
  type: str
  default: esther-poniatowski/apoikia
  help: Repository holding the reusable workflows, as <owner>/<name>

apoikia_ref:
  type: str
  default: main
  help: Tag or commit of apoikia that the generated workflows call

# Decisions of the organization stated in CONTRIBUTING.md. An empty answer renders the
# corresponding TODO comment, so that the decision stays visible until it is taken.

admin_name:
  type: str
  default: ""
  help: Person to whom questions about the guidelines are addressed

admin_email:
  type: str
  default: ""
  help: Email address of that person

maintainer:
  type: str
  default: ""
  help: Maintainer to notify when sensitive content is committed (Markdown allowed)

data_storage:
  type: str
  default: ""
  help: Storage location of the datasets, as a noun phrase (e.g. "the institutional server")

external_contributions_policy:
  type: str
  default: ""
  help: Sentence stating whether external contributors may open issues and pull requests

release_archive:
  type: str
  default: ""
  help: Service archiving the releases of publications with a DOI (e.g. "Zenodo")

publication_policy:
  type: str
  default: ""
  help: Sentence stating when a study repository is made public and whether it is archived

license_policy:
  type: str
  default: ""
  help: Default licenses, as a parenthetical (e.g. "MIT for code, CC BY 4.0 for documents")

topics:
  type: yaml
  default: []
  help: Topics set on repositories, as a YAML list

languages:
  type: yaml
  default: []
  help: Supported languages, as a YAML list
