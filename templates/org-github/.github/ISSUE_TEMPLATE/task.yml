name: Task
description: Feature, analysis, or change of documentation
labels: ["task"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What to do and why.
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: Conditions under which the issue can be closed.
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Branches, files or lines concerned, as links.
      placeholder: |
        - [File](https://github.com/<owner>/<repository>/blob/main/path/to/file.py#L10-L20)
  - type: textarea
    id: references
    attributes:
      label: References
      description: Related issues, pull requests, or documents.
      placeholder: |
        - Related to #<number>
